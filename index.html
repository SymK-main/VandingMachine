<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자판기 화면</title>
    <!-- CSS 분리 및 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- main > h1 + 음료 선택 section + 결제 영역 section + 배출구 div -->
<main class="vending-machine">
    <h1 class="sr-only">음료 자판기</h1>

    <div class="vending-machine__body">
        <!-- 왼쪽: 음료 선택 영역 -->
        <section class="vending-machine__products-section" aria-labelledby="products-title">
            <h2 id="products-title" class="sr-only">음료 선택</h2>

            <!-- 라디오 버튼 그룹을 fieldset과 legend로 묶기 -->
            <fieldset class="vending-machine__fieldset">
                <legend class="sr-only">음료 선택 목록</legend>
                <!-- JS가 DRY 원칙에 따라 12개 음료 슬롯을 자동 생성해 넣는 영역 -->
                <div id="productGrid" class="vending-machine__products"></div>
            </fieldset>
        </section>

        <!-- 오른쪽: 결제 영역 (aside 대신 독립 기능 영역인 section 사용) -->
        <section class="vending-machine__payment-panel" aria-label="결제 영역">
            <div class="vending-machine__led-screen" aria-hidden="true"></div>
            <div class="vending-machine__card-reader" aria-hidden="true"></div>
            <div class="vending-machine__bill-acceptor" aria-hidden="true"></div>
            <div class="vending-machine__coin-panel" aria-hidden="true">
                <div class="vending-machine__return-lever"></div>
                <div class="vending-machine__coin-slot"></div>
            </div>
        </section>
    </div>

    <!-- 하단: 음료 배출구 (바닥글 footer가 아닌 장식 요소 div + aria-hidden="true") -->
    <div class="vending-machine__dispenser" aria-hidden="true"></div>
</main>

<script>
    // DRY원칙 -> 상품 데이터와 UI 구조를 분리
    const baseDrinks = [
        { productId: 'cola', name: '콜라', price: 2000, image: 'images/cola.png' },
        { productId: 'sprite', name: '사이다', price: 2000, image: 'images/sprite.png' },
        { productId: 'orange-juice', name: '오렌지주스', price: 1800, image: 'images/OrangeJ.png' },
        { productId: 'can-coffee', name: '캔커피', price: 1000, image: 'images/canCoffee.png' },
        { productId: 'powerade', name: '이온음료', price: 1300, image: 'images/powerAde.png' },
        { productId: 'water', name: '생수', price: 800, image: 'images/water.png' }
    ];

    // 3x4(12칸) 진열 슬롯 생성: 상품 종류(productId)와 진열 위치(slotId)를 구분
    const drinkSlots = [...baseDrinks, ...baseDrinks].map(function (drink, index) {
        const slotNumber = String(index + 1).padStart(2, '0');
        return {
            slotId: drink.productId + '-slot-' + slotNumber, // 예: cola-slot-01, cola-slot-07
            productId: drink.productId,
            name: drink.name,
            price: drink.price,
            image: drink.image
        };
    });

    // 모든 상품에 동일한 렌더링 규칙 적용 (label 안에 상품명과 가격을 함께 배치)
    function createDrinkElement(slot) {
        const label = document.createElement('label');
        label.className = 'vending-machine__product';

        const img = document.createElement('img');
        img.className = 'vending-machine__product-image';
        img.src = slot.image;
        img.alt = ''; // 아래 span에서 상품명을 읽어주므로 중복 음성 출력 방지

        const nameSpan = document.createElement('span');
        nameSpan.className = 'vending-machine__product-name';
        nameSpan.textContent = slot.name;

        const priceRow = document.createElement('span');
        priceRow.className = 'vending-machine__price-row';

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'drink';
        input.value = slot.slotId;
        input.className = 'vending-machine__radio';

        const priceSpan = document.createElement('span');
        priceSpan.textContent = slot.price.toLocaleString('ko-KR') + '원';

        priceRow.append(input, priceSpan);
        label.append(img, nameSpan, priceRow);

        return label;
    }

    const productGrid = document.getElementById('productGrid');
    drinkSlots.forEach(function (slot) {
        productGrid.appendChild(createDrinkElement(slot));
    });
</script>
</body>
</html>
